<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevXOmar Systems Map</title>
  <desc id="desc">A dark animated systems map showing how Omar connects research, AI, cybersecurity, backend systems, and edge deployment through projects including LLMLens, TattvaDrishti, JOCKY, Nyord, and Rakshak.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#07152F"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(550 170) rotate(180) scale(520 230)">
      <stop stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1030 235) rotate(-155) scale(380 190)">
      <stop stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spineGrad" x1="140" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="0.48" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.68"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="0.34" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="0.72" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7DD3FC" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.3"/>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="320" rx="22"/>
    </clipPath>

    <style>
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes blink {
        0%, 44%, 100% { opacity: 1; }
        52%, 90% { opacity: .24; }
      }
      @keyframes breathe {
        0%,100% { opacity: .55; transform: scale(.97); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes cardPulse {
        0%,100% { stroke-opacity: .34; }
        50% { stroke-opacity: .58; }
      }

      .edge {
        stroke-dasharray: 14 16;
        animation: dash 7s linear infinite;
      }
      .blink { animation: blink 1.9s ease-in-out infinite; }
      .nodePulse {
        animation: breathe 4.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .nodePulse.alt { animation-duration: 5s; animation-direction: reverse; }
      .projectCard { animation: cardPulse 5.2s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .edge,.blink,.nodePulse,.projectCard { animation:none!important; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#cyanGlow)"/>
    <rect width="1200" height="320" fill="url(#indigoGlow)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- Header -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
      <circle cx="52" cy="42" r="4" fill="#22D3EE" class="blink"/>
      <text x="67" y="47" fill="#67E8F9" font-size="12" font-weight="760" letter-spacing="2.8">DEVXOMAR // SYSTEMS MAP</text>

      <text x="52" y="88" fill="#F8FAFC" font-size="24" font-weight="710" letter-spacing="-0.45">Research → Intelligence → Systems → Deployment</text>
      <text x="52" y="114" fill="#8EA8C1" font-size="13.5" font-weight="500">
        The same engineering loop, across models, secure runtimes, distributed backends, and real-world autonomy.
      </text>
    </g>

    <!-- Main system spine -->
    <path id="spine" d="M140 178 C235 137 282 137 370 174 C455 210 510 210 600 177 C692 143 742 143 830 176 C918 209 968 205 1060 174"
      stroke="url(#spineGrad)" stroke-width="1.6" fill="none"/>
    <path d="M140 178 C235 137 282 137 370 174 C455 210 510 210 600 177 C692 143 742 143 830 176 C918 209 968 205 1060 174"
      stroke="#22D3EE" stroke-opacity="0.12" stroke-width="8" fill="none" filter="url(#soft)"/>

    <!-- travelling signal -->
    <circle r="3.4" fill="#67E8F9" filter="url(#glow)">
      <animateMotion dur="6.8s" repeatCount="indefinite">
        <mpath href="#spine"/>
      </animateMotion>
    </circle>
    <circle r="2.7" fill="#A5B4FC">
      <animateMotion dur="8.7s" begin="-4.1s" repeatCount="indefinite">
        <mpath href="#spine"/>
      </animateMotion>
    </circle>

    <!-- Node stems -->
    <g stroke="#31566F" stroke-width="1" opacity=".74">
      <line x1="140" y1="164" x2="140" y2="145"/>
      <line x1="370" y1="160" x2="370" y2="145"/>
      <line x1="600" y1="163" x2="600" y2="145"/>
      <line x1="830" y1="162" x2="830" y2="145"/>
      <line x1="1060" y1="160" x2="1060" y2="145"/>
    </g>

    <!-- Domain labels + nodes -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="140" y="137" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.25">RESEARCH</text>
      <g class="nodePulse">
        <circle cx="140" cy="178" r="15" fill="#081B2C" stroke="#22D3EE" stroke-opacity=".55"/>
        <circle cx="140" cy="178" r="4.2" fill="#22D3EE"/>
      </g>

      <text x="370" y="137" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.25">AI / ML</text>
      <g class="nodePulse alt">
        <circle cx="370" cy="174" r="15" fill="#081B2C" stroke="#38BDF8" stroke-opacity=".55"/>
        <circle cx="370" cy="174" r="4.2" fill="#38BDF8"/>
      </g>

      <text x="600" y="137" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.25">CYBER</text>
      <g class="nodePulse">
        <circle cx="600" cy="177" r="15" fill="#0A1731" stroke="#60A5FA" stroke-opacity=".56"/>
        <circle cx="600" cy="177" r="4.2" fill="#60A5FA"/>
      </g>

      <text x="830" y="137" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.25">BACKEND</text>
      <g class="nodePulse alt">
        <circle cx="830" cy="176" r="15" fill="#0D1532" stroke="#818CF8" stroke-opacity=".57"/>
        <circle cx="830" cy="176" r="4.2" fill="#818CF8"/>
      </g>

      <text x="1060" y="137" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.25">EDGE</text>
      <g class="nodePulse">
        <circle cx="1060" cy="174" r="15" fill="#10142F" stroke="#6366F1" stroke-opacity=".6"/>
        <circle cx="1060" cy="174" r="4.2" fill="#A5B4FC"/>
      </g>
    </g>

    <!-- Project anchors: fixed-width cards prevent text collision -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
      <g>
        <rect class="projectCard" x="61" y="215" width="158" height="58" rx="12" fill="#071522" stroke="#22D3EE"/>
        <text x="140" y="237" text-anchor="middle" fill="#E6FAFF" font-size="12" font-weight="720">LLMLens</text>
        <text x="140" y="255" text-anchor="middle" fill="#7594AA" font-size="10.5" font-weight="500">reliability · probes</text>
      </g>

      <g>
        <rect class="projectCard" x="291" y="215" width="158" height="58" rx="12" fill="#071522" stroke="#38BDF8"/>
        <text x="370" y="237" text-anchor="middle" fill="#E6FAFF" font-size="12" font-weight="720">TattvaDrishti</text>
        <text x="370" y="255" text-anchor="middle" fill="#7594AA" font-size="10.5" font-weight="500">AI intelligence</text>
      </g>

      <g>
        <rect class="projectCard" x="521" y="215" width="158" height="58" rx="12" fill="#081427" stroke="#60A5FA"/>
        <text x="600" y="237" text-anchor="middle" fill="#EAF2FF" font-size="12" font-weight="720">JOCKY</text>
        <text x="600" y="255" text-anchor="middle" fill="#7F94B6" font-size="10.5" font-weight="500">forensic runtime</text>
      </g>

      <g>
        <rect class="projectCard" x="751" y="215" width="158" height="58" rx="12" fill="#0A132A" stroke="#818CF8"/>
        <text x="830" y="237" text-anchor="middle" fill="#EEF0FF" font-size="12" font-weight="720">Nyord</text>
        <text x="830" y="255" text-anchor="middle" fill="#858DB5" font-size="10.5" font-weight="500">async · real-time</text>
      </g>

      <g>
        <rect class="projectCard" x="981" y="215" width="158" height="58" rx="12" fill="#101329" stroke="#6366F1"/>
        <text x="1060" y="237" text-anchor="middle" fill="#F0EEFF" font-size="12" font-weight="720">Rakshak</text>
        <text x="1060" y="255" text-anchor="middle" fill="#8E8FB8" font-size="10.5" font-weight="500">autonomy · edge</text>
      </g>
    </g>

    <!-- Bottom signal philosophy -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <path d="M52 295H118L126 287L134 303L143 278L151 298L160 295H206" stroke="#22D3EE" stroke-width="1.15" fill="none" opacity=".58"/>
      <circle cx="206" cy="295" r="2.8" fill="#67E8F9" opacity=".9"/>
      <text x="228" y="299" fill="#64748B" font-size="9.3" letter-spacing="1.18">RELIABILITY / EVIDENCE / REAL-TIME / AUTONOMY</text>
    </g>

    <!-- Frame -->
    <rect x="1" y="1" width="1198" height="318" rx="21" stroke="#27445E" stroke-opacity=".42"/>
    <rect class="edge" x="2" y="2" width="1196" height="316" rx="20" stroke="url(#edge)" stroke-width="1.4" stroke-dashoffset="0" fill="none"/>
  </g>
</svg>
