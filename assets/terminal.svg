<svg width="1200" height="318" viewBox="0 0 1200 318" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevXOmar terminal profile</title>
  <desc id="desc">A terminal-style summary of Omar's current work and engineering focus.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1200" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.55" stop-color="#06101F"/>
      <stop offset="1" stop-color="#071525"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1200" y2="0"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#07101D"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      @keyframes blink{0%,46%{opacity:1}50%,100%{opacity:0}} .cursor{animation:blink 1.05s steps(1,end) infinite}
      @keyframes dash{to{stroke-dashoffset:-160}} .edge{animation:dash 7s linear infinite}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="316" rx="20" fill="url(#shell)" stroke="#1E293B"/>
  <rect x="1" y="1" width="1198" height="48" rx="20" fill="url(#top)"/>
  <path d="M1 49H1199" stroke="#1E293B"/>
  <circle cx="27" cy="25" r="6" fill="#F87171"/><circle cx="49" cy="25" r="6" fill="#FBBF24"/><circle cx="71" cy="25" r="6" fill="#34D399"/>
