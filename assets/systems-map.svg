<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevXOmar Systems Map</title>
  <desc id="desc">Animated midnight navy systems map connecting research, AI, cybersecurity, backend systems, and edge computing.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#07152F"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(720 126) rotate(180) scale(460 190)">
      <stop stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1080 210) rotate(-150) scale(360 160)">
      <stop stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="265" y1="0" x2="915" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="0.52" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="0.35" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7DD3FC" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="260" rx="22"/>
    </clipPath>

    <style>
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes blink {
        0%, 44%, 100% { opacity: 1; }
        52%, 90% { opacity: .22; }
      }
      @keyframes breathe {
        0%,100% { opacity: .42; transform: scale(.96); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulseLine {
        0%,100% { opacity: .28; }
        50% { opacity: .82; }
      }

      .edge {
        stroke-dasharray: 14 16;
        animation: dash 6.5s linear infinite;
      }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .nodePulse {
        animation: breathe 3.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .nodePulse2 {
        animation: breathe 4.7s ease-in-out infinite reverse;
        transform-box: fill-box;
        transform-origin: center;
      }
      .signal { animation: pulseLine 3.2s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .edge,.blink,.nodePulse,.nodePulse2,.signal { animation:none!important; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#cyanGlow)"/>
    <rect width="1200" height="260" fill="url(#indigoGlow)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
      <circle cx="52" cy="46" r="4" fill="#22D3EE" class="blink"/>
      <text x="67" y="51" fill="#67E8F9" font-size="12" font-weight="760" letter-spacing="2.8">DEVXOMAR // SYSTEMS MAP</text>

      <text x="52" y="92" fill="#F8FAFC" font-size="24" font-weight="710" letter-spacing="-0.5">Research → Engineering → Deployment</text>
      <text x="52" y="119" fill="#8EA8C1" font-size="13.5" font-weight="500">
        A compact map of the areas I keep connecting in real systems.
      </text>
    </g>

    <path id="spine" d="M300 175 C392 132 450 140 531 168 C610 195 691 188 765 153 C829 123 881 128 935 163"
      stroke="url(#lineGrad)" stroke-width="1.5" fill="none"/>
    <path d="M300 175 C392 132 450 140 531 168 C610 195 691 188 765 153 C829 123 881 128 935 163"
      stroke="#22D3EE" stroke-opacity="0.13" stroke-width="7" fill="none" filter="url(#soft)"/>

    <circle r="3.2" fill="#67E8F9" filter="url(#glow)">
      <animateMotion dur="6.2s" repeatCount="indefinite">
        <mpath href="#spine"/>
      </animateMotion>
    </circle>
    <circle r="2.6" fill="#818CF8">
      <animateMotion dur="8.1s" begin="-3.4s" repeatCount="indefinite">
        <mpath href="#spine"/>
      </animateMotion>
    </circle>

    <g stroke="#31566F" stroke-width="1" opacity=".72">
      <line x1="355" y1="155" x2="355" y2="118"/>
      <line x1="492" y1="157" x2="492" y2="113"/>
      <line x1="632" y1="183" x2="632" y2="139"/>
      <line x1="777" y1="148" x2="777" y2="105"/>
      <line x1="901" y1="151" x2="901" y2="111"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <g class="nodePulse">
        <circle cx="355" cy="105" r="14" fill="#081B2C" stroke="#22D3EE" stroke-opacity=".48"/>
        <circle cx="355" cy="105" r="4" fill="#22D3EE"/>
      </g>
      <text x="355" y="82" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.1">RESEARCH</text>

      <g class="nodePulse2">
        <circle cx="492" cy="100" r="14" fill="#081B2C" stroke="#38BDF8" stroke-opacity=".48"/>
        <circle cx="492" cy="100" r="4" fill="#38BDF8"/>
      </g>
      <text x="492" y="77" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.1">AI / ML</text>

      <g class="nodePulse">
        <circle cx="632" cy="126" r="14" fill="#0A1731" stroke="#60A5FA" stroke-opacity=".50"/>
        <circle cx="632" cy="126" r="4" fill="#60A5FA"/>
      </g>
      <text x="632" y="103" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.1">CYBER</text>

      <g class="nodePulse2">
        <circle cx="777" cy="92" r="14" fill="#0D1532" stroke="#818CF8" stroke-opacity=".52"/>
        <circle cx="777" cy="92" r="4" fill="#818CF8"/>
      </g>
      <text x="777" y="69" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.1">SYSTEMS</text>

      <g class="nodePulse">
        <circle cx="901" cy="98" r="14" fill="#10142F" stroke="#6366F1" stroke-opacity=".54"/>
        <circle cx="901" cy="98" r="4" fill="#A5B4FC"/>
      </g>
      <text x="901" y="75" text-anchor="middle" fill="#D8F7FF" font-size="11" font-weight="700" letter-spacing="1.1">EDGE</text>
    </g>

    <g>
      <rect x="980" y="38" width="170" height="178" rx="16" fill="#07111F" stroke="#314A66" stroke-opacity=".7"/>
      <rect x="995" y="54" width="140" height="31" rx="8" fill="#081B2C" stroke="#22D3EE" stroke-opacity=".18"/>
      <circle cx="1011" cy="69" r="4" fill="#22C55E" class="blink"/>
      <text x="1023" y="73" fill="#B9D4E5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10.5" font-weight="700" letter-spacing=".9">CURRENT MODE</text>

      <text x="995" y="111" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="17" font-weight="720">Research + Build</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">
        <rect x="995" y="126" width="53" height="24" rx="12" fill="#092036" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="1021.5" y="142" text-anchor="middle" fill="#A5F3FC">AI/ML</text>

        <rect x="1054" y="126" width="69" height="24" rx="12" fill="#0A1D38" stroke="#60A5FA" stroke-opacity=".28"/>
        <text x="1088.5" y="142" text-anchor="middle" fill="#BFDBFE">CYBER</text>

        <rect x="995" y="157" width="71" height="24" rx="12" fill="#0B1938" stroke="#818CF8" stroke-opacity=".30"/>
        <text x="1030.5" y="173" text-anchor="middle" fill="#C7D2FE">BACKEND</text>

        <rect x="1072" y="157" width="51" height="24" rx="12" fill="#11142F" stroke="#6366F1" stroke-opacity=".32"/>
        <text x="1097.5" y="173" text-anchor="middle" fill="#C4B5FD">EDGE</text>
      </g>

      <text x="995" y="202" fill="#60758D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8.8" letter-spacing=".9">SIGNAL / ACTIVE</text>
    </g>

    <g class="signal" opacity=".72">
      <path d="M52 205H137L146 196L155 214L165 181L174 208L184 205H260"
        stroke="#22D3EE" stroke-width="1.2" fill="none"/>
      <circle cx="260" cy="205" r="3" fill="#67E8F9"/>
    </g>
    <text x="52" y="231" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="9.5" letter-spacing="1.25">INTELLIGENCE / RELIABILITY / INFRASTRUCTURE / AUTONOMY</text>

    <rect x="1" y="1" width="1198" height="258" rx="21" stroke="#27445E" stroke-opacity=".42"/>
    <rect class="edge" x="2" y="2" width="1196" height="256" rx="20" stroke="url(#edge)"
      stroke-width="1.4" stroke-dashoffset="0" fill="none"/>
  </g>
</svg>