<svg width="1200" height="338" viewBox="0 0 1200 338" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Omar engineering contract terminal</title>
  <desc id="desc">A terminal-style engineering manifesto focused on evidence, failure-aware design, release gates, and a measurable build loop.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1200" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.52" stop-color="#06101F"/>
      <stop offset="1" stop-color="#071525"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#07101D"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1200" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset=".38" stop-color="#22D3EE" stop-opacity=".42"/>
      <stop offset=".76" stop-color="#6366F1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".14"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1000 250) rotate(180) scale(360 185)">
      <stop stop-color="#22D3EE" stop-opacity=".055"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      @keyframes blink { 0%,46%{opacity:1} 50%,100%{opacity:0} }
      @keyframes dash { to { stroke-dashoffset:-168; } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      .cursor{animation:blink 1.05s steps(1,end) infinite}
      .edge{animation:dash 7.5s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){.cursor,.edge,.pulse{animation:none!important}}
    </style>
  </defs>

  <!-- shell -->
  <rect x="1" y="1" width="1198" height="336" rx="20" fill="url(#shell)" stroke="#1E293B"/>
  <rect x="1" y="1" width="1198" height="336" rx="20" fill="url(#ambient)"/>

  <!-- title bar -->
  <rect x="1" y="1" width="1198" height="48" rx="20" fill="url(#top)"/>
  <path d="M1 49H1199" stroke="#1E293B"/>
  <circle cx="27" cy="25" r="6" fill="#F87171"/>
  <circle cx="49" cy="25" r="6" fill="#FBBF24"/>
  <circle cx="71" cy="25" r="6" fill="#34D399"/>
  <text x="600" y="30" text-anchor="middle" fill="#64748B"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="12" letter-spacing="1">omar@devx — ~/engineering/contract</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">
    <rect x="1016" y="15" width="145" height="20" rx="10" fill="#071B29" stroke="#22D3EE" stroke-opacity=".22"/>
    <circle cx="1031" cy="25" r="3" fill="#34D399" class="pulse"/>
    <text x="1040" y="28.5" fill="#89CFE1">BUILD CONTRACT</text>
  </g>

  <!-- terminal content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.2">
    <!-- manifesto -->
    <text x="36" y="82" fill="#22D3EE">omar@devx:~$</text>
    <text x="164" y="82" fill="#E2E8F0">cat engineering.manifest</text>
    <text x="36" y="108" fill="#94A3B8">proof &gt; claims  ·  failure paths are first-class  ·  operators stay in control</text>

    <!-- failure-aware design -->
    <text x="36" y="151" fill="#22D3EE">omar@devx:~$</text>
    <text x="164" y="151" fill="#E2E8F0">./design --for=failure --for=operators</text>
    <text x="36" y="177" fill="#94A3B8">timeouts:bounded  ·  retries:deliberate  ·  fallbacks:explicit  ·  telemetry:on  ·  rollback:ready</text>

    <!-- release gates -->
    <text x="36" y="220" fill="#22D3EE">omar@devx:~$</text>
    <text x="164" y="220" fill="#E2E8F0">./ship --gates</text>

    <text x="36" y="246" fill="#94A3B8">tests</text>
    <text x="80" y="246" fill="#34D399">[pass]</text>
    <text x="148" y="246" fill="#94A3B8">benchmarks</text>
    <text x="232" y="246" fill="#34D399">[pass]</text>
    <text x="300" y="246" fill="#94A3B8">reproducibility</text>
    <text x="421" y="246" fill="#34D399">[pass]</text>
    <text x="489" y="246" fill="#94A3B8">observability</text>
    <text x="594" y="246" fill="#34D399">[pass]</text>
    <text x="662" y="246" fill="#94A3B8">docs</text>
    <text x="699" y="246" fill="#34D399">[pass]</text>

    <!-- build loop -->
    <text x="36" y="289" fill="#22D3EE">omar@devx:~$</text>
    <text x="164" y="289" fill="#E2E8F0">echo $BUILD_LOOP</text>

    <text x="36" y="315" fill="#94A3B8">hypothesis</text>
    <text x="118" y="315" fill="#475569">→</text>
    <text x="142" y="315" fill="#94A3B8">prototype</text>
    <text x="216" y="315" fill="#475569">→</text>
    <text x="240" y="315" fill="#94A3B8">measure</text>
    <text x="303" y="315" fill="#475569">→</text>
    <text x="327" y="315" fill="#94A3B8">harden</text>
    <text x="385" y="315" fill="#475569">→</text>
    <text x="409" y="315" fill="#67E8F9">ship</text>
    <text x="444" y="315" fill="#475569">→</text>
    <text x="468" y="315" fill="#A5B4FC">learn</text>
    <rect class="cursor" x="515" y="301" width="9" height="16" fill="#67E8F9"/>
  </g>

  <!-- quiet right-side signal -->
  <g opacity=".68">
    <path d="M1000 289H1040L1048 281L1056 297L1065 270L1074 292L1083 289H1134"
      stroke="#22D3EE" stroke-width="1.1" fill="none"/>
    <circle cx="1148" cy="301" r="3.5" fill="#22D3EE" class="pulse"/>
    <circle cx="1148" cy="301" r="10" fill="#22D3EE" opacity=".12" filter="url(#glow)"/>
  </g>

  <!-- animated frame -->
  <rect class="edge" x="2" y="2" width="1196" height="334" rx="19"
    fill="none" stroke="url(#edgeGrad)" stroke-width="1.2" stroke-dasharray="18 24"/>
</svg>
